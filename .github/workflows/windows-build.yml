name: Build Pulse Windows
on:
  push:
    branches: [codex/windows-1-7-2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: desktop/src-tauri/target
          key: windows-pulse-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Test current backend and frontend
        shell: pwsh
        run: |
          python -m pip install -r scripts/requirements-windows-build.txt
          python -m unittest discover -s local-web/tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location local-web
          foreach ($Test in Get-ChildItem tests -Filter *.cjs) {
            node $Test.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Pop-Location
      - name: Build installer
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Install and verify native app
        shell: pwsh
        run: |
          python scripts/verify-windows-package.py --installer outputs/windows/Pulse-1.7.2-Windows-x64-Setup.exe --report outputs/windows/verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-1.7.2-Windows-x64
          path: |
            outputs/windows/Pulse-1.7.2-Windows-x64-Setup.exe
            outputs/windows/SHA256SUMS.txt
            outputs/windows/verification.json
          if-no-files-found: error
          retention-days: 30
