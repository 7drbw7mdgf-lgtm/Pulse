name: Build Pulse Windows
on:
  push:
    branches: [main, 'codex/release-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache/restore@v4
        with:
          path: desktop/src-tauri/target
          key: windows-pulse-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: windows-pulse-
      - name: Test current backend and frontend
        shell: pwsh
        run: |
          python -m pip install -r scripts/requirements-windows-build.txt
          python -m unittest discover -s local-web/tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location local-web
          foreach ($Test in Get-ChildItem tests -Filter *.cjs) {
            node $Test.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Pop-Location
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $Version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$Version" >> $env:GITHUB_OUTPUT
      - name: Build installer
        id: build
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Install and verify native app
        shell: pwsh
        run: |
          python scripts/verify-windows-package.py --installer outputs/windows/Pulse-${{ steps.version.outputs.version }}-Windows-x64-Setup.exe --report outputs/windows/verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save successful compilation cache
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: desktop/src-tauri/target
          key: windows-pulse-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-${{ steps.version.outputs.version }}-Windows-x64
          path: |
            outputs/windows/Pulse-${{ steps.version.outputs.version }}-Windows-x64-Setup.exe
            outputs/windows/SHA256SUMS.txt
            outputs/windows/verification.json
          if-no-files-found: error
          retention-days: 30
